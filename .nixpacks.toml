[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@10.26.1 --activate && pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-spec run codegen",
  "pnpm --filter @workspace/api-server run build",
  "BASE_PATH=/ pnpm --filter @workspace/miniapp run build"
]

[start]
cmd = "NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs"
